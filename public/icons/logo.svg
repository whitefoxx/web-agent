<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Web Agent product mark. Source of truth for the rasterized PNG toolbar /
       store icons in this dir (regenerate with sharp, never qlmanage — that
       bakes a white background over the rounded corners).

       The spark is the hero and the cursor is deliberately small: Web Agent is
       the only one of the three shells with an agent of its own, so the mark
       leads with the brain and lets the hands come second. WebCLI, which is the
       hands without the brain, keeps the wire-globe + cursor mark this repo used
       until 2026-09-07 — it lives in the web-tools repo and is already on the
       store under it. Three shells sharing a cursor motif made them
       indistinguishable in a toolbar; a star, a globe and a pair of brackets do
       not. Gradient and amber are unchanged, so the family still reads. -->
  <defs>
    <linearGradient id="wa" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="118" y2="118">
      <stop offset="0" stop-color="#4F6BFF"/>
      <stop offset="1" stop-color="#A44DFF"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#wa)"/>
  <path d="M0 -1 C0.12 -0.34 0.34 -0.12 1 0 C0.34 0.12 0.12 0.34 0 1 C-0.12 0.34 -0.34 0.12 -1 0 C-0.34 -0.12 -0.12 -0.34 0 -1 Z"
        transform="translate(58 56) scale(40)" fill="#fff"/>
  <path d="M0 0 L0 16 L3.7 12.4 L6.2 18.5 L8.6 17.5 L6.1 11.5 L11 11.5 Z"
        transform="translate(88 78) rotate(-20) scale(2.2)" fill="#F5A623"/>
</svg>
