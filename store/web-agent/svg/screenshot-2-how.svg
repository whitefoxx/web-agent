<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#1A1236"/>
    </linearGradient>
    <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="118" y2="118">
      <stop offset="0" stop-color="#4F6BFF"/><stop offset="1" stop-color="#A44DFF"/>
    </linearGradient>
    <!-- Same ramp in objectBoundingBox units, for UI drawn anywhere on the
         canvas. The gradient above is pinned to the logo 128 box, so reusing
         it on a 1280-wide card clamps to the end colour. -->
    <linearGradient id="brandUI" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F6BFF"/><stop offset="1" stop-color="#A44DFF"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4F6BFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4F6BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A44DFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#A44DFF" stop-opacity="0"/>
    </radialGradient>
  </defs><rect width="1280" height="800" fill="url(#bg)"/><circle cx="640" cy="720" r="700" fill="url(#glowP)"/><g transform="translate(72 58) scale(0.359375)">
    <rect width="128" height="128" rx="28" fill="url(#brand)"/>
    <path d="M0 -1 C0.12 -0.34 0.34 -0.12 1 0 C0.34 0.12 0.12 0.34 0 1 C-0.12 0.34 -0.34 0.12 -1 0 C-0.34 -0.12 -0.12 -0.34 0 -1 Z"
          transform="translate(58 56) scale(40)" fill="#fff"/>
    <path d="M0 0 L0 16 L3.7 12.4 L6.2 18.5 L8.6 17.5 L6.1 11.5 L11 11.5 Z"
          transform="translate(80 74) rotate(-20) scale(2.7)" fill="#F5A623"/>
  </g><text x="132" y="91" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#F5F7FF" text-anchor="start" letter-spacing="0.5" opacity="1">Web Agent</text><text x="72" y="196" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="48" font-weight="700" fill="#F5F7FF" text-anchor="start" letter-spacing="0" opacity="1">You ask. It works the page.</text><text x="72" y="244" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">In the browser you already use, with the accounts you are already in.</text><rect x="72" y="268" width="1136" height="92" rx="16" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.09)"/><circle cx="126" cy="314" r="26" fill="url(#brandUI)"/><text x="126" y="324" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#F5F7FF" text-anchor="middle" letter-spacing="0" opacity="1">1</text><text x="178" y="308" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#F5F7FF" text-anchor="start" letter-spacing="0" opacity="1">You ask</text><text x="178" y="342" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">In plain language, in the side panel.</text><rect x="72" y="380" width="1136" height="92" rx="16" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.09)"/><circle cx="126" cy="426" r="26" fill="url(#brandUI)"/><text x="126" y="436" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#F5F7FF" text-anchor="middle" letter-spacing="0" opacity="1">2</text><text x="178" y="420" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#F5F7FF" text-anchor="start" letter-spacing="0" opacity="1">It plans</text><text x="178" y="454" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">Your model picks the tools. You bring the model.</text><rect x="72" y="492" width="1136" height="92" rx="16" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.09)"/><circle cx="126" cy="538" r="26" fill="url(#brandUI)"/><text x="126" y="548" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#F5F7FF" text-anchor="middle" letter-spacing="0" opacity="1">3</text><text x="178" y="532" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#F5F7FF" text-anchor="start" letter-spacing="0" opacity="1">It acts</text><text x="178" y="566" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">Opens tabs, reads, clicks, types — in your Chrome.</text><rect x="72" y="604" width="1136" height="92" rx="16" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.09)"/><circle cx="126" cy="650" r="26" fill="url(#brandUI)"/><text x="126" y="660" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#F5F7FF" text-anchor="middle" letter-spacing="0" opacity="1">4</text><text x="178" y="644" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#F5F7FF" text-anchor="start" letter-spacing="0" opacity="1">You confirm</text><text x="178" y="678" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">Anything that writes stops and shows you what it will do.</text><text x="72" y="742" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="400" fill="#727C9C" text-anchor="start" letter-spacing="0" opacity="1">No credentials are stored — it reuses the session you already have.</text></svg>