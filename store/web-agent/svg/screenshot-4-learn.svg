<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#1A1236"/>
    </linearGradient>
    <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="118" y2="118">
      <stop offset="0" stop-color="#4F6BFF"/><stop offset="1" stop-color="#A44DFF"/>
    </linearGradient>
    <!-- Same ramp in objectBoundingBox units, for UI drawn anywhere on the
         canvas. The gradient above is pinned to the logo 128 box, so reusing
         it on a 1280-wide card clamps to the end colour. -->
    <linearGradient id="brandUI" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F6BFF"/><stop offset="1" stop-color="#A44DFF"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4F6BFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4F6BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A44DFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#A44DFF" stop-opacity="0"/>
    </radialGradient>
  </defs><rect width="1280" height="800" fill="url(#bg)"/><circle cx="260" cy="640" r="640" fill="url(#glowP)"/><circle cx="1040" cy="200" r="560" fill="url(#glowB)"/><g transform="translate(72 58) scale(0.359375)">
    <rect width="128" height="128" rx="28" fill="url(#brand)"/>
    <path d="M0 -1 C0.12 -0.34 0.34 -0.12 1 0 C0.34 0.12 0.12 0.34 0 1 C-0.12 0.34 -0.34 0.12 -1 0 C-0.34 -0.12 -0.12 -0.34 0 -1 Z"
          transform="translate(58 56) scale(40)" fill="#fff"/>
    <path d="M0 0 L0 16 L3.7 12.4 L6.2 18.5 L8.6 17.5 L6.1 11.5 L11 11.5 Z"
          transform="translate(80 74) rotate(-20) scale(2.7)" fill="#F5A623"/>
  </g><text x="132" y="91" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#F5F7FF" text-anchor="start" letter-spacing="0.5" opacity="1">Web Agent</text><text x="72" y="196" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="700" fill="#F5F7FF" text-anchor="start" letter-spacing="0" opacity="1">It can learn a site nobody wrote support for</text><text x="72" y="244" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">Instead of you writing a scraper and maintaining it forever.</text><rect x="72" y="300" width="362.6666666666667" height="250" rx="18" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.09)"/><text x="102" y="352" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#F5A623" text-anchor="start" letter-spacing="0" opacity="1">Look</text><text x="102" y="400" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">Structured data, the accessibility</text><text x="102" y="432" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">tree, and the requests the page</text><text x="102" y="464" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">makes — where did this value</text><text x="102" y="496" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">really come from?</text><rect x="458.6666666666667" y="300" width="362.6666666666667" height="250" rx="18" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.09)"/><text x="488.6666666666667" y="352" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#F5A623" text-anchor="start" letter-spacing="0" opacity="1">Try</text><text x="488.6666666666667" y="400" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">Run JavaScript in the page’s own</text><text x="488.6666666666667" y="432" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">origin until the answer comes</text><text x="488.6666666666667" y="464" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">back the same way twice.</text><rect x="845.3333333333334" y="300" width="362.6666666666667" height="250" rx="18" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.09)"/><text x="875.3333333333334" y="352" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#F5A623" text-anchor="start" letter-spacing="0" opacity="1">Keep</text><text x="875.3333333333334" y="400" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">Save what worked as a reusable</text><text x="875.3333333333334" y="432" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">tool, so the second time is</text><text x="875.3333333333334" y="464" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">instant and deterministic.</text><text x="72" y="626" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#F5F7FF" text-anchor="start" letter-spacing="0" opacity="1">And what it works out, you keep.</text><text x="72" y="668" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">The route it found becomes a tool you can call again — instant and deterministic the second time,</text><text x="72" y="704" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">and yours, rather than an entry on a list of supported sites that somebody has to keep from rotting.</text></svg>