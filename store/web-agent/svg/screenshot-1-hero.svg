<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#1A1236"/>
    </linearGradient>
    <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="118" y2="118">
      <stop offset="0" stop-color="#4F6BFF"/><stop offset="1" stop-color="#A44DFF"/>
    </linearGradient>
    <!-- Same ramp in objectBoundingBox units, for UI drawn anywhere on the
         canvas. The gradient above is pinned to the logo 128 box, so reusing
         it on a 1280-wide card clamps to the end colour. -->
    <linearGradient id="brandUI" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F6BFF"/><stop offset="1" stop-color="#A44DFF"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4F6BFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4F6BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A44DFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#A44DFF" stop-opacity="0"/>
    </radialGradient>
  </defs><rect width="1280" height="800" fill="url(#bg)"/><circle cx="300" cy="200" r="620" fill="url(#glowB)"/><circle cx="1000" cy="640" r="620" fill="url(#glowP)"/><g transform="translate(576 96) scale(1)">
    <rect width="128" height="128" rx="28" fill="url(#brand)"/>
    <path d="M0 -1 C0.12 -0.34 0.34 -0.12 1 0 C0.34 0.12 0.12 0.34 0 1 C-0.12 0.34 -0.34 0.12 -1 0 C-0.34 -0.12 -0.12 -0.34 0 -1 Z"
          transform="translate(58 56) scale(40)" fill="#fff"/>
    <path d="M0 0 L0 16 L3.7 12.4 L6.2 18.5 L8.6 17.5 L6.1 11.5 L11 11.5 Z"
          transform="translate(80 74) rotate(-20) scale(2.7)" fill="#F5A623"/>
  </g><text x="640" y="320" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="78" font-weight="700" fill="#F5F7FF" text-anchor="middle" letter-spacing="0" opacity="1">Web Agent</text><text x="640" y="392" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="27" font-weight="400" fill="#AEB7D4" text-anchor="middle" letter-spacing="0" opacity="1">An AI agent in your side panel that uses your browser —</text><text x="640" y="436" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="27" font-weight="400" fill="#AEB7D4" text-anchor="middle" letter-spacing="0" opacity="1">it reads, clicks and fills in the pages you are already signed into.</text><g transform="translate(213.5 0)"><g>
    <rect x="0" y="500" width="254" height="46" rx="23" fill="rgba(88,166,255,0.12)" stroke="rgba(88,166,255,0.32)"/>
    <text x="127" y="530.48" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="22" font-weight="400" fill="#C7D0FF" text-anchor="middle" letter-spacing="0" opacity="1">50+ browser tools</text>
  </g><g>
    <rect x="266" y="500" width="307" height="46" rx="23" fill="rgba(88,166,255,0.12)" stroke="rgba(88,166,255,0.32)"/>
    <text x="419.5" y="530.48" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="22" font-weight="400" fill="#C7D0FF" text-anchor="middle" letter-spacing="0" opacity="1">your logged-in Chrome</text>
  </g><g>
    <rect x="585" y="500" width="268" height="46" rx="23" fill="rgba(88,166,255,0.12)" stroke="rgba(88,166,255,0.32)"/>
    <text x="719" y="530.48" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="22" font-weight="400" fill="#C7D0FF" text-anchor="middle" letter-spacing="0" opacity="1">bring your own key</text>
  </g></g><text x="640" y="648" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#727C9C" text-anchor="middle" letter-spacing="0" opacity="1">You bring the model: any OpenAI-compatible endpoint, your own key.</text><text x="640" y="692" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#727C9C" text-anchor="middle" letter-spacing="0" opacity="1">Nothing is sent to a server of ours. There is no server of ours.</text></svg>