      <stop offset="0" stop-color="#4F6BFF"/><stop offset="1" stop-color="#A44DFF"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4F6BFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4F6BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A44DFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#A44DFF" stop-opacity="0"/>
    </radialGradient>
  </defs><rect width="1400" height="560" fill="url(#bg)"/><circle cx="260" cy="120" r="520" fill="url(#glowB)"/><circle cx="1150" cy="460" r="520" fill="url(#glowP)"/><g transform="translate(96 208) scale(1.21875)">
    <rect width="128" height="128" rx="28" fill="url(#brand)"/>
