  </g><text x="304" y="246" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="76" font-weight="700" fill="#F5F7FF" text-anchor="start" letter-spacing="0" opacity="1">Web Agent</text><text x="304" y="308" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">An AI agent in your side panel that uses your own browser.</text><text x="304" y="354" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">Signed in already. 50+ tools. Bring your own model.</text><text x="304" y="412" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#F5A623" text-anchor="start" letter-spacing="0" opacity="1">Every write stops for your confirmation.</text></svg>